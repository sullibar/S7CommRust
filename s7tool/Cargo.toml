# SPDX-License-Identifier: LGPL-3.0-or-later
[package]
name = "s7tool"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "LGPL-3.0-or-later"
description = "Minimal interactive CLI for the s7commplus driver: browse, read, and write PLC tags by symbol name."
publish = false

[dependencies]
# Depend on the driver by path — this is exactly how an external app would consume it
# (swap the path for a `git`/registry source). Nothing else here is driver-specific.
s7commplus = { path = ".." }
env_logger = "0.11" # writes the driver's `log` output to the session log (or stderr)
log = "0.4"

[[bin]]
name = "s7tool"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
